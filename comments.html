
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comments – Money Games</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;500&display=swap');

    :root {
        --bg: radial-gradient(circle at top, #0a0f24, #000);
        --text: #fff;
        --accent: #00eaff;
        --card-bg: rgba(255,255,255,0.05);
        --card-border: rgba(0,234,255,0.3);
    }

    body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: 'Roboto', sans-serif;
    }

    nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px 40px;
        background: rgba(0,0,0,0.4);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 100;
    }

    nav h1 {
        font-family: 'Orbitron', sans-serif;
        font-size: 28px;
        letter-spacing: 3px;
        color: var(--accent);
        text-shadow: 0 0 10px var(--accent);
    }

    nav a {
        color: var(--text);
        margin-left: 20px;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
    }

    nav a:hover {
        color: var(--accent);
    }

    h2 {
        font-family: 'Orbitron', sans-serif;
        text-align: center;
        margin-top: 40px;
        font-size: 40px;
        color: var(--accent);
        text-shadow: 0 0 10px var(--accent);
    }

    .explain-box {
        max-width: 900px;
        margin: 20px auto;
        padding: 20px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        text-align: center;
        font-size: 18px;
        line-height: 1.6;
        box-shadow: 0 0 15px rgba(0,234,255,0.2);
    }

    .comment-box {
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,234,255,0.2);
        transition: opacity 0.2s ease;
    }

    .comment-box.dimmed {
        opacity: 0.4;
    }

    .comment-box input,
    .comment-box textarea {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: rgba(255,255,255,0.1);
        color: var(--text);
        font-size: 16px;
        box-sizing: border-box;
        max-width: 100%;
    }

    .comment-box textarea {
        resize: vertical;
        max-height: 200px;
        overflow: auto;
    }

    .comment-box button {
        margin-top: 15px;
        padding: 12px 20px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        color: #000;
        font-size: 18px;
    }

    #commentsList {
        max-width: 900px;
        margin: 20px auto;
    }

    .comment-item {
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(0,234,255,0.3);
        padding: 15px;
        margin-bottom: 10px;
        border-radius: 10px;
    }

    .comment-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
    }

    .comment-name {
        color: var(--accent);
        font-weight: bold;
    }

    .comment-meta {
        font-size: 12px;
        opacity: 0.7;
    }

    .comment-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
        font-size: 14px;
        flex-wrap: wrap;
    }

    .vote-btn {
        cursor: pointer;
        border: none;
        background: transparent;
        color: var(--accent);
        font-size: 16px;
    }

    .vote-btn.active {
        color: #ffdd00;
    }

    .score {
        min-width: 30px;
        text-align: center;
    }

    .reply-link {
        cursor: pointer;
        color: var(--accent);
        font-size: 13px;
    }

    .reply-box {
        margin-top: 10px;
    }

    .reply-box textarea {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: rgba(255,255,255,0.05);
        color: var(--text);
        font-size: 14px;
        box-sizing: border-box;
        resize: vertical;
        max-height: 150px;
        overflow: auto;
    }

    .reply-box button {
        margin-top: 6px;
        padding: 6px 12px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        color: #000;
        font-size: 14px;
    }

    .children {
        margin-left: 20px;
        margin-top: 8px;
        border-left: 1px solid rgba(0,234,255,0.2);
        padding-left: 10px;
    }

    #scrollSentinel {
        height: 40px;
    }

    /* Safe text wrapping */
    .comment-text {
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: break-word;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<nav>
    <h1>Money Games</h1>
    <div>
        <a href="index.html">Home</a>
        <a href="index.html#games">Games</a>
        <a href="about.html">About</a>
        <a href="comments.html">Comments</a>
    </div>
</nav>

<h2>Community Comments</h2>

<div class="explain-box">
    Feel free to leave a comment below.<br>
    Share ideas, feedback, game suggestions, or just say hi.<br>
    Newest threads appear at the top. Replies are threaded.<br>
    Please keep it respectful – toxic or insulting comments are blocked.
</div>

<div class="comment-box">
    <input id="displayName" placeholder="Name to display">
    <textarea id="commentText" placeholder="Write your comment..." rows="4"></textarea>
    <button id="postRootBtn">Post Comment</button>
</div>

<div id="commentsList"></div>
<div id="scrollSentinel"></div>

<script>
/* ------------------ CONFIG ------------------ */

const SUPABASE_URL = "https://dagktrogjsxocawwgzkw.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRhZ2t0cm9nanN4b2Nhd3dnemt3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1NTg2NzYsImV4cCI6MjA5MzEzNDY3Nn0.oMhEtCEzykI-2qM6Rz0N3ceU7lAlhwWCATNAjw0XE6o";

const PAGE_ID = "comments-page";
const PAGE_SIZE = 5;

const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentPage = 0;
let topLevel = [];
let replies = [];
let votes = {};

let voterId = localStorage.getItem("mg_voter_id");
if (!voterId) {
    voterId = crypto.randomUUID();
    localStorage.setItem("mg_voter_id", voterId);
}

const commentsListEl = document.getElementById("commentsList");
const postRootBtn = document.getElementById("postRootBtn");
const commentBoxEl = document.querySelector(".comment-box");
const scrollSentinel = document.getElementById("scrollSentinel");

let isLoading = false;
let hasMore = true;

/* ------------------ MODERATION ------------------ */

const MAX_LINES = 20;
const RATE_LIMIT_INTERVAL_MS = 30_000;
const RATE_LIMIT_WINDOW_MS = 10 * 60_000;
const RATE_LIMIT_MAX_IN_WINDOW = 10;

function estimateToxicity(text) {
    const toxicWords = [
        "fuck","shit","bitch","asshole","bastard","cunt","slut","whore",
        "retard","dick","pussy","fag","moron","idiot","stupid","loser",
        "kill yourself","kys","hate you","disgusting","trash","garbage"
    ];
    const lower = text.toLowerCase();
    let hits = 0;
    toxicWords.forEach(w => {
        if (lower.includes(w)) hits++;
    });
    const words = lower.split(/\s+/).filter(Boolean).length || 1;
    return hits / words;
}

function validateComment(text) {
    const bannedWords = [
        "fuck","shit","bitch","asshole","bastard","cunt","slut","whore",
        "retard","dick","pussy","fag","moron","idiot","stupid","loser"
    ];

    const lower = text.toLowerCase();

    if (bannedWords.some(w => lower.includes(w))) {
        return "Your comment contains banned or insulting language.";
    }

    const lines = text.split(/\r?\n/);
    if (lines.length > MAX_LINES) {
        return `Your comment is too long (maximum ${MAX_LINES} lines).`;
    }

    const toxicity = estimateToxicity(text);
    if (toxicity >= 0.04) {
        return "Your comment seems too toxic. Please rewrite it more respectfully.";
    }

    return null;
}

function checkRateLimit() {
    const now = Date.now();

    const lastTs = Number(localStorage.getItem("mg_last_comment_ts") || "0");
    if (now - lastTs < RATE_LIMIT_INTERVAL_MS) {
        const waitSec = Math.ceil((RATE_LIMIT_INTERVAL_MS - (now - lastTs)) / 1000);
        return `You are commenting too fast. Please wait ${waitSec} seconds.`;
    }

    let windowStart = Number(localStorage.getItem("mg_comment_window_start") || "0");
    let count = Number(localStorage.getItem("mg_comment_window_count") || "0");

    if (now - windowStart > RATE_LIMIT_WINDOW_MS) {
        windowStart = now;
        count = 0;
    }

    if (count >= RATE_LIMIT_MAX_IN_WINDOW) {
        return "You have posted a lot recently. Please take a short break before posting more.";
    }

    return null;
}

function registerCommentAttempt() {
    const now = Date.now();
    let windowStart = Number(localStorage.getItem("mg_comment_window_start") || "0");
    let count = Number(localStorage.getItem("mg_comment_window_count") || "0");

    if (now - windowStart > RATE_LIMIT_WINDOW_MS) {
        windowStart = now;
        count = 0;
    }

    count += 1;

    localStorage.setItem("mg_last_comment_ts", String(now));
    localStorage.setItem("mg_comment_window_start", String(windowStart));
    localStorage.setItem("mg_comment_window_count", String(count));
}
/* ------------------ LOAD + RENDER COMMENTS ------------------ */

async function loadComments(initial = false) {
    if (isLoading) return;
    isLoading = true;

    const from = currentPage * PAGE_SIZE;
    const to = from + PAGE_SIZE - 1;

    const { data: parents, error: pErr } = await client
        .from("comments")
        .select("*")
        .eq("page_id", PAGE_ID)
        .is("parent_id", null)
        .order("created_at", { ascending: false })
        .range(from, to);

    if (pErr) {
        console.error(pErr);
        isLoading = false;
        return;
    }

    if (initial) {
        topLevel = parents || [];
    } else {
        topLevel = topLevel.concat(parents || []);
    }

    if (!parents || parents.length < PAGE_SIZE) {
        hasMore = false;
    }

    const { data: replyRows, error: rErr } = await client
        .from("comments")
        .select("*")
        .eq("page_id", PAGE_ID)
        .not("parent_id", "is", null)
        .order("created_at", { ascending: true });

    if (rErr) {
        console.error(rErr);
        isLoading = false;
        return;
    }

    replies = replyRows || [];

    const ids = [...topLevel, ...replies].map(c => c.id);
    if (ids.length > 0) {
        const { data: voteRows, error: vErr } = await client
            .from("comment_votes")
            .select("*")
            .in("comment_id", ids);

        if (vErr) {
            console.error(vErr);
        } else {
            buildVotes(voteRows || []);
        }
    } else {
        votes = {};
    }

    renderTree();
    isLoading = false;
}

function buildVotes(rows) {
    votes = {};
    rows.forEach(v => {
        if (!votes[v.comment_id]) votes[v.comment_id] = { score: 0, myVote: 0 };
        votes[v.comment_id].score += v.vote_type;
        if (v.voter_hash === voterId) votes[v.comment_id].myVote = v.vote_type;
    });
}

function formatDate(dateStr) {
    const d = new Date(dateStr);
    return d.toLocaleString("en-GB", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}

function renderTree() {
    commentsListEl.innerHTML = "";

    const children = {};
    [...topLevel, ...replies].forEach(c => {
        if (c.parent_id) {
            if (!children[c.parent_id]) children[c.parent_id] = [];
            children[c.parent_id].push(c);
        }
    });

    topLevel.forEach(c => {
        commentsListEl.appendChild(renderNode(c, children));
    });
}

function renderNode(comment, childrenMap) {
    const wrap = document.createElement("div");
    wrap.className = "comment-item";

    const scoreInfo = votes[comment.id] || { score: 0, myVote: 0 };

    wrap.innerHTML = `
        <div class="comment-header">
            <span class="comment-name">${comment.user_name}</span>
            <span class="comment-meta">${formatDate(comment.created_at)}</span>
        </div>
        <div class="comment-text">${escapeHtml(comment.content)}</div>
        <div class="comment-actions">
            <button class="vote-btn up" aria-label="Thumbs up">👍</button>
            <span class="score">${scoreInfo.score}</span>
            <button class="vote-btn down" aria-label="Thumbs down">👎</button>
            <span class="reply-link">Reply</span>
        </div>
    `;

    const up = wrap.querySelector(".up");
    const down = wrap.querySelector(".down");

    if (scoreInfo.myVote === 1) up.classList.add("active");
    if (scoreInfo.myVote === -1) down.classList.add("active");

    up.onclick = () => handleVote(comment.id, 1);
    down.onclick = () => handleVote(comment.id, -1);

    wrap.querySelector(".reply-link").onclick = (e) => {
        e.stopPropagation();
        toggleReplyBox(comment.id, wrap);
    };

    const kids = childrenMap[comment.id] || [];
    if (kids.length > 0) {
        const childWrap = document.createElement("div");
        childWrap.className = "children";
        kids.forEach(k => childWrap.appendChild(renderNode(k, childrenMap)));
        wrap.appendChild(childWrap);
    }

    return wrap;
}

function closeAllReplies() {
    document.querySelectorAll(".reply-box").forEach(box => box.remove());
    commentBoxEl.classList.remove("dimmed");
}

function toggleReplyBox(parentId, el) {
    const existing = el.querySelector(".reply-box");
    if (existing) {
        existing.remove();
        commentBoxEl.classList.remove("dimmed");
        return;
    }

    closeAllReplies();

    const box = document.createElement("div");
    box.className = "reply-box";

    const textarea = document.createElement("textarea");
    textarea.rows = 3;
    textarea.placeholder = "Write a reply...";

    const btn = document.createElement("button");
    btn.textContent = "Post reply";

    btn.onclick = async () => {
        const name = document.getElementById("displayName").value.trim();
        const text = textarea.value.trim();

        if (!name || !text) {
            alert("Enter a name and reply text.");
            return;
        }

        const rateError = checkRateLimit();
        if (rateError) {
            alert(rateError);
            return;
        }

        const error = validateComment(text);
        if (error) {
            alert(error);
            return;
        }

        const { error: dbErr } = await client
            .from("comments")
            .insert({
                page_id: PAGE_ID,
                parent_id: parentId,
                user_name: name,
                content: text
            });

        if (dbErr) {
            console.error(dbErr);
            alert("Failed to post reply.");
            return;
        }

        registerCommentAttempt();
        await loadComments(true);
        commentBoxEl.classList.remove("dimmed");
    };

    box.appendChild(textarea);
    box.appendChild(btn);
    el.appendChild(box);

    commentBoxEl.classList.add("dimmed");
}

document.addEventListener("click", (e) => {
    const inReplyBox = e.target.closest(".reply-box");
    const inReplyLink = e.target.closest(".reply-link");
    if (inReplyBox || inReplyLink) return;
    closeAllReplies();
});

async function handleVote(commentId, type) {
    const current = votes[commentId] || { myVote: 0 };

    await client
        .from("comment_votes")
        .delete()
        .match({ comment_id: commentId, voter_hash: voterId });

    if (current.myVote === type) {
        await loadComments(true);
        return;
    }

    const { error } = await client
        .from("comment_votes")
        .insert({
            comment_id: commentId,
            voter_hash: voterId,
            vote_type: type
        });

    if (error) console.error(error);

    await loadComments(true);
}

function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}

/* ------------------ POST ROOT COMMENT ------------------ */

postRootBtn.onclick = async () => {
    const name = document.getElementById("displayName").value.trim();
    const text = document.getElementById("commentText").value.trim();

    if (!name || !text) {
        alert("Please enter a name and a comment.");
        return;
    }

    const rateError = checkRateLimit();
    if (rateError) {
        alert(rateError);
        return;
    }

    const error = validateComment(text);
    if (error) {
        alert(error);
        return;
    }

    const { error: dbErr } = await client
        .from("comments")
        .insert({
            page_id: PAGE_ID,
            parent_id: null,
            user_name: name,
            content: text
        });

    if (dbErr) {
        console.error(dbErr);
        alert("Failed to post comment.");
        return;
    }

    registerCommentAttempt();
    document.getElementById("commentText").value = "";
    currentPage = 0;
    hasMore = true;
    await loadComments(true);
};

/* ------------------ INFINITE SCROLL ------------------ */

const observer = new IntersectionObserver((entries) => {
    const entry = entries[0];
    if (entry.isIntersecting && hasMore && !isLoading) {
        currentPage++;
        loadComments(false);
    }
}, {
    root: null,
    rootMargin: "0px",
    threshold: 0.1
});

observer.observe(scrollSentinel);

window.addEventListener("DOMContentLoaded", () => {
    currentPage = 0;
    hasMore = true;
    loadComments(true);
});
</script>

</body>
</html>
